<svg xmlns="http://www.w3.org/2000/svg" width="360" height="184" viewBox="0 0 360 184">
  <title>Chats, Files and Apps</title>
  <style>
    @media (prefers-color-scheme: dark) {
      :root { --paper-card: #28231e; --paper-rule: #494138; --paper-ink: #f4ede3; --paper-ink-2: #d2c8bd; --latte-foam: #49392d; --latte-espresso: #e6c299 }
    }
  </style>
  <g id="places">
    <rect x=".5" y=".5" width="359" height="183" rx="18" fill="var(--paper-card, #faf6ef)" stroke="var(--paper-rule, #ded5c7)"/>
    <path d="M37 51v82" fill="none" stroke="var(--latte-espresso, #8e7157)" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 5"/>
    <g fill="var(--latte-foam, #ebddcb)">
      <rect x="16" y="16" width="42" height="42" rx="14"/>
      <rect x="16" y="71" width="42" height="42" rx="14"/>
      <rect x="16" y="126" width="42" height="42" rx="14"/>
    </g>
    <g fill="none" stroke="var(--latte-espresso, #65432f)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(25 25)" d="M20.5 11.7a8 8 0 0 1-8.6 8 8.7 8.7 0 0 1-3.6-.9L3.5 20.5l1.7-4.8a8 8 0 0 1-.9-3.7 8 8 0 0 1 8-8 8 8 0 0 1 8.2 7.7z"/>
      <path transform="translate(25 80)" d="M3 7a2 2 0 0 1 2-2h3.5l2 2.5H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <g transform="translate(25 135)">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </g>
    </g>
    <g font-family="Georgia, serif" font-size="22" font-weight="bold" fill="var(--paper-ink, #29241f)">
      <text x="73" y="35">Chats</text><text x="73" y="90">Files</text><text x="73" y="145">Apps</text>
    </g>
    <g font-family="system-ui, sans-serif" font-size="13.2" fill="var(--paper-ink-2, #514940)">
      <text x="73" y="53">Talk with your agents.</text>
      <text x="73" y="108">You and your agents read and write here.</text>
      <text x="73" y="163">What you build and install lives here.</text>
    </g>
  </g>
</svg>
